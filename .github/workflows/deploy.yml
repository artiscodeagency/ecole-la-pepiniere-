name: Deploy (Hostinger)

# Manual only. Defaults: dry_run=true (build, tests, e2e, read-only SSH
# diagnostics; nothing changes on the server), no migrations, no first deploy.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, tests and read-only diagnostics only (no change on the server)"
        type: boolean
        default: true
      run_migrations:
        description: "Run php artisan migrate --force (the DB is backed up and verified first)"
        type: boolean
        default: false
      allow_initial:
        description: "First deploy: replace the current static public_html (backed up and verified first)"
        type: boolean
        default: false

concurrency: { group: deploy-production, cancel-in-progress: false }
permissions: { contents: read }

env:
  SITE: lapepiniere.artischools.com
  PHP_VERSION: "8.4"   # composer.lock (Symfony 8) requires PHP >= 8.4.1; Hostinger CLI is 8.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy scripts (LF endings, bash syntax, ShellCheck)
        run: |
          if grep -rlI $'\r' deploy .github .gitattributes; then echo "CRLF line endings found"; exit 1; fi
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | head -n 2
          for f in deploy/*.sh deploy/tests/*.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/*.sh deploy/tests/*.sh
          bash deploy/tests/ssh-setup-test.sh

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Frontend (npm ci, lint, build)
        run: |
          npm ci
          npm run lint
          npm run build
          test -f dist/index.html && test -f dist/admin.html

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, intl, mbstring, pdo_mysql, pdo_sqlite, zip, fileinfo, bcmath
          coverage: none
      - name: Backend (Composer checks, tests, PHP syntax)
        working-directory: backend
        run: |
          php -v | head -n 1
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test
          for f in ../deploy/*.php ../deploy/public_html/index.php; do php -l "$f"; done

      - name: "Package release (vendor built here: no Composer on the server)"
        run: |
          rm -f backend/.env
          (cd backend && rm -rf vendor \
            && composer install --no-dev --optimize-autoloader --no-interaction --no-progress \
            && composer check-platform-reqs --no-dev)
          mkdir -p pkg/web pkg/deploy
          cp -r dist/. pkg/web/
          cp deploy/public_html/index.php deploy/public_html/.htaccess pkg/web/
          cp deploy/preflight.php deploy/mysql-defaults.php deploy/rollback.sh pkg/deploy/
          rsync -a \
            --exclude=/storage --exclude=/tests --exclude=/node_modules --exclude=/.env \
            --exclude=/public/media --exclude=/database/database.sqlite \
            backend/ pkg/backend/
          test ! -e pkg/backend/.env
          # Folders Laravel needs at runtime (git does not keep empty ones).
          for d in pkg/backend/resources/views pkg/backend/bootstrap/cache pkg/backend/vendor pkg/web/assets; do
            test -d "$d" || { echo "missing in package: $d"; exit 1; }
          done
          tar -czf release.tgz -C pkg .
          ls -lh release.tgz
      - uses: actions/upload-artifact@v4
        with: { name: release, path: release.tgz, retention-days: 7 }

  # Runs the real deploy + rollback scripts against a Hostinger-like container
  # (PHP 8.4 + Apache .htaccess + MariaDB, proc_open disabled).
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release }
      - name: "E2E: deploy, routing, media, rollback (Docker)"
        run: bash deploy/tests/e2e.sh release.tgz

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment: production   # protect with required reviewers in the repo settings
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations && '1' || '0' }}
      ALLOW_INITIAL: ${{ inputs.allow_initial && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release }

      # Writes ~/.ssh/{config,deploy_key,known_hosts} and validates them with
      # `ssh -G` + ssh-keygen (no connection, prints only OK/FAIL labels).
      - name: SSH setup (pinned host key, validated, no secret printed)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash deploy/ssh-setup.sh

      - name: Diagnostics (read-only)
        run: tr -d '\r' < deploy/diagnose.sh | ssh target "bash -s -- $SITE"

      - name: Upload and switch release
        if: ${{ !inputs.dry_run }}
        run: |
          ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::12}"
          scp release.tgz target:"release-$ID.tgz"
          tr -d '\r' < deploy/remote-deploy.sh | ssh target "cat > remote-deploy-$ID.sh"
          ssh target "bash remote-deploy-$ID.sh $SITE $ID ~/release-$ID.tgz $RUN_MIGRATIONS $ALLOW_INITIAL; s=\$?; rm -f remote-deploy-$ID.sh release-$ID.tgz; exit \$s"

      - name: Smoke test
        if: ${{ !inputs.dry_run }}
        run: |
          # One independent check per line: path and expected status.
          fail=0
          while read -r path want; do
            got=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE$path")
            if [ "$got" = "$want" ]; then echo "OK   $path -> $got"; else echo "FAIL $path -> $got (want $want)"; fail=1; fi
          done <<'PATHS'
          / 200
          /notre-ecole 200
          /actualites 200
          /admin 200
          /admin/connexion 200
          /up 200
          /robots.txt 200
          /sitemap.xml 200
          /api/public/school-info 200
          PATHS
          exit $fail

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts
